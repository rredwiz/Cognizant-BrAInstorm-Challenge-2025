services:
    - type: web
      name: sustainabite-backend
      runtime: python
      region: oregon
      plan: free
      rootDir: .
      buildCommand: pip install -r requirements.txt
      startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
      healthCheckPath: /health
      envVars:
          - key: GEMINI_API_KEY
            sync: false
          - key: BASE_URL
            sync: false
          - key: PYTHON_VERSION
            value: 3.11.0
          - key: PORT
            value: 10000
      disk:
          name: sustainabite-data
          mountPath: /opt/render/project/src
          sizeGB: 1
      autoDeploy: true
