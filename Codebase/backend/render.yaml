services:
    - type: web
      name: sustainabite-backend
      runtime: python
      region: oregon
      plan: free
      # Point to the backend directory
      rootDir: .
      # Build command - install dependencies
      buildCommand: pip install -r requirements.txt
      # Start command - run the FastAPI app with uvicorn
      startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
      # Health check endpoint
      healthCheckPath: /health
      # Environment variables
      envVars:
          - key: GEMINI_API_KEY
            sync: false # You'll need to set this in Render dashboard
          - key: BASE_URL
            sync: false # Set this to your Render URL (e.g., https://sustainabite-backend.onrender.com)
          - key: PYTHON_VERSION
            value: 3.11.0
          - key: PORT
            value: 10000
      # Disk for storing the ML model and data files
      disk:
          name: sustainabite-data
          mountPath: /opt/render/project/src
          sizeGB: 1
      # Auto deploy when you push to main
      autoDeploy: true
